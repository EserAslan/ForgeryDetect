# ── SonarQube / SonarCloud yapılandırması ──────────────────────────────
# SonarCloud > Project > Information sayfasından kendi değerlerini yaz:
sonar.projectKey=EserAslan_ForgeryDetect
sonar.organization=eseraslan

# Görünen ad ve sürüm
sonar.projectName=Goruntu Sahteciligi Tespiti
sonar.projectVersion=1.0

# ── Analiz edilecek kaynak kod ──────────────────────────────────────────
# Hem Python backend hem TypeScript frontend taranır
sonar.sources=backend,frontend/src

# ── Analiz DIŞI bırakılacaklar ──────────────────────────────────────────
# venv, node_modules, migration'lar, model dosyaları ve build çıktıları
# gerçek kodu boğmasın diye hariç tutulur
sonar.exclusions=\
  **/venv/**,\
  **/.venv/**,\
  **/node_modules/**,\
  **/migrations/**,\
  **/models/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/*.onnx,\
  **/*.onnx.data

# ── Dil ayarları ────────────────────────────────────────────────────────
sonar.python.version=3.12, 3.13, 3.14
sonar.sourceEncoding=UTF-8
